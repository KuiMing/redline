<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>逆統戰</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg:#0b1020; --panel:#11182b; --text:#eef2ff; --muted:#9aa7c7;
    --road:#d8a04a; --rail:#ef4444; --border:#2b385d;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
  #app { display:grid; grid-template-columns:340px 1fr; height:100vh; }
  aside { background:linear-gradient(180deg,var(--panel),#0d1426); border-right:1px solid #26314f; padding:16px; overflow:auto; }
  main { position:relative; }
  #map { position:absolute; inset:0; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:.04em; }
  .sub { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:14px; }
  .card { background:rgba(23,33,58,.92); border:1px solid var(--border); border-radius:14px; padding:12px; margin:12px 0; box-shadow:0 10px 28px rgba(0,0,0,.22); }
  label { display:block; color:#c7d2fe; font-size:12px; margin:10px 0 6px; }
  input,select,button { width:100%; border-radius:10px; border:1px solid #344264; background:#0d1426; color:var(--text); padding:9px 10px; outline:none; }
  button { cursor:pointer; background:#1c2a49; transition:.15s; }
  button:hover { background:#26375e; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:#0d1426; border:1px solid #27375d; padding:10px; border-radius:12px; }
  .stat b { font-size:18px; display:block; }
  .stat span { font-size:11px; color:var(--muted); }
  .legend { display:flex; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted); }
  .legend i { width:14px;height:8px;border-radius:99px; display:inline-block; margin-right:5px; vertical-align:middle; }
  #info { font-size:13px; line-height:1.6; }
  #info .name { font-size:19px; color:#fff; font-weight:800; margin-bottom:5px; }
  #info code { background:#0b1020; padding:2px 6px; border-radius:6px; color:#dbeafe; }
  .pill { display:inline-block; font-size:11px; border:1px solid #3d4b70; background:#0e1629; padding:2px 7px; border-radius:999px; margin:2px; color:#dbeafe; }
  .toolbar { position:absolute; right:16px; top:16px; display:flex; gap:8px; z-index:800; }
  .toolbar button { width:auto; min-width:96px; background:rgba(17,24,43,.92); backdrop-filter:blur(8px); }
  .leaflet-container { background:#0f1728; }
  .leaflet-popup-content-wrapper,.leaflet-popup-tip { background:#0f1728; color:#eef2ff; }
  .leaflet-control-attribution { background:rgba(10,15,26,.7) !important; color:#d4dcf6; }
  .leaflet-control-attribution a { color:#9fc1ff; }
  .town-label { background:rgba(8,16,32,.84); border:1px solid rgba(188,204,255,.2); color:#eef2ff; border-radius:4px; padding:1px 4px; font-size:11px; box-shadow:none; pointer-events:none; }
  .town-label.leaflet-tooltip-left:before, .town-label.leaflet-tooltip-right:before,
  .town-label.leaflet-tooltip-top:before, .town-label.leaflet-tooltip-bottom:before { display:none; }
  .note { font-size:12px; color:#aab7d8; line-height:1.55; }
  .status-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .status-tile { background:#0d1426; border:1px solid #27375d; padding:10px; border-radius:12px; }
  .status-tile b { display:block; font-size:15px; color:#fff; margin-bottom:4px; }
  .status-tile span { display:block; font-size:12px; color:var(--muted); line-height:1.5; }
  .hint-strong { color:#dbeafe; font-weight:700; }
  .shared-badge-wrap { background:transparent; border:none; }
  .shared-badge {
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(250, 204, 21, 0.96);
    color:#111827;
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    font-size:11px;
    font-weight:800;
    letter-spacing:.02em;
  }
  .shared-badge.shared-badge-multi {
    background:linear-gradient(135deg, rgba(250,204,21,.98), rgba(251,146,60,.98));
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>逆統戰</h1>

    <div class="card">
      <label>搜尋城鎮</label>
      <input id="searchBox" placeholder="例：臺北、香港城、喀什、烏蘭巴托" />
      <div class="row">
        <div>
          <label>統治者</label>
          <select id="rulerFilter"><option value="">全部</option></select>
        </div>
        <div>
          <label>陣營</label>
          <select id="campFilter"><option value="">全部</option></select>
        </div>
      </div>
      <label>城鎮類型</label>
      <select id="typeFilter"><option value="">全部</option></select>
      <div class="row" style="margin-top:10px;">
        <button id="resetFilter">清除篩選</button>
        <button id="fitFiltered">聚焦結果</button>
      </div>
    </div>

    <div class="card">
      <div class="legend">
        <span><i style="background:var(--road)"></i>一般道路：金色</span>
        <span><i style="background:#7dd3fc"></i>鐵路：藍色虛線</span>
        <span><i style="background:#ffffff"></i>已選城鎮：白色描邊</span>
      </div>
    </div>

    <div class="card">
      <div class="status-grid">
        <div class="status-tile">
          <b id="statusCurrentPlayer">未連線</b>
          <span>當前行動玩家</span>
        </div>
        <div class="status-tile">
          <b id="statusSelectedTown">尚未選取</b>
          <span>目前地圖選取城鎮</span>
        </div>
      </div>
      <div class="note" id="interactionHint" style="margin-top:10px;">連上遊戲後，只有 <span class="hint-strong">當前玩家自己擁有組織</span> 的城鎮可以高亮合法移動。</div>
      <div style="margin-top:10px; display:grid; gap:8px;">
        <button id="directBuildBtn" disabled>在目前城鎮建立組織</button>
        <div class="note" id="directBuildHint">選取具有自己組織或共享組織可用性的城鎮後，這裡會顯示是否可直接建立。</div>
        <button id="dissolveBtn" disabled>瓦解目前城鎮共享組織</button>
        <div class="note" id="dissolveHint">選取具有共享可用性的城鎮後，這裡會顯示是否可對實際組織擁有者發動瓦解。</div>
      </div>
    </div>

    <div class="card" id="info">
      <div class="name">尚未選取城鎮</div>
      <div>點擊地圖上的城鎮查看統治者、陣營、城鎮類型，以及一般道路 / 鐵路連線。</div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <button id="fitAll">Fit All</button>
      <button id="focusAsia">Focus Asia</button>
      <button id="exportView">Export View</button>
    </div>
    <div id="map"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/leaflet_game_map_logic.js?v=rail-three-step-20260704"></script>
</body>
</html>
