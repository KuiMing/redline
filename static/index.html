<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Redline UI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Redline – Game State</h1>
  <div class="section">
    <button onclick="createGame()">Create Game</button>
    <button onclick="refreshState()">Refresh</button>
    <button onclick="advanceTurn()">Advance Phase</button>
  </div>

  <div id="controls" class="section"></div>

  <div class="section">
    <h3>Move Organization</h3>
    <input id="moveFrom" placeholder="From town">
    <input id="moveTo" placeholder="To town">
    <select id="moveMode">
      <option value="road">road</option>
      <option value="rail">rail</option>
    </select>
    <button onclick="moveOrg()">Move</button>
    <div id="legalMoves"></div>
  </div>

  <div id="game"></div>

  <script src="/static/app.js"></script>
</body>
</html>
