<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>REDLINE // STRATEGIC COMMAND</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="warTitle">逆統戰</div>

<div id="topBar">
  <div class="title">REDLINE STRATEGIC COMMAND</div>
  <div id="statusBar"></div>
</div>

<div id="hud"></div>
<div id="debugSocketState" style="display:none"></div>

<div id="lobby">
  <button onclick="createRoom()">INITIATE COMMAND</button>
  <input id="roomId" placeholder="ROOM ID">
  <input id="playerName" placeholder="CALLSIGN">
  <button onclick="joinRoom()">JOIN OPERATION</button>
  <button onclick="startGame()">START</button>
  <div id="factionPicker" style="display:none; margin-top:12px;">
    <div class="panel-title">FACTION SELECTION</div>
    <div id="factionPickerInfo"></div>
    <div id="factionList"></div>
    <div id="factionVariantList" style="display:none; margin-top:8px;"></div>
  </div>
</div>

<div id="gameShell" style="display:none">
  <div id="gameTabs">
    <button class="game-tab active" data-view="command">指揮中心</button>
    <button class="game-tab" data-view="map">戰略地圖</button>
  </div>

  <div id="commandView" class="game-view active">
    <div id="commandGrid">
      <div id="controlPanel" class="panel">
        <div class="panel-title">CONTROL</div>
        <button onclick="sendAction('advance')">ADVANCE</button>
        <div id="baseSelectionPanel" style="display:none; margin-top:8px;">
          <div class="panel-title">BASE SELECTION</div>
          <div id="baseSelectionInfo"></div>
          <div id="baseSelectionChoices"></div>
        </div>
        <div id="purchase"></div>
      </div>

      <div id="logPanel" class="panel">
        <div class="panel-title">INTEL LOG</div>
        <div id="log"></div>
      </div>

      <div id="handPanel" class="panel">
        <div class="panel-title">INTEL HAND</div>
        <div id="hand"></div>
      </div>

      <div id="eraPanel" class="panel">
        <div class="panel-title">ACTIVE ERA</div>
        <div id="eras"></div>
      </div>
    </div>
  </div>

  <div id="mapView" class="game-view">
    <div id="mapPanel" class="panel map-only-panel">
      <iframe
        id="strategicMapFrame"
        title="Strategic Map"
        src="about:blank"
        loading="eager"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
