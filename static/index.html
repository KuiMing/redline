<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>REDLINE // STRATEGIC COMMAND</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="stageViewport">
<div id="designStage">

<div id="warTitle">逆統戰</div>

<div id="topBar">
  <div class="title">逆統戰指揮中心</div>
  <div id="statusBar"></div>
</div>

<div id="hud"></div>
<div id="phaseActionBar">
  <div id="phaseActionMeta"></div>
  <button id="advanceStepBtn" class="phase-action-btn" onclick="sendAction('advance')">結束目前步驟</button>
</div>
<div id="debugSocketState" style="display:none"></div>

<div id="lobby">
  <button onclick="createRoom()">建立房間</button>
  <input id="roomId" placeholder="房間 ID">
  <input id="playerName" placeholder="玩家名稱 / 代號">
  <button onclick="joinRoom()">加入房間</button>
  <button onclick="startGame()">開始遊戲</button>
  <div id="factionPicker" style="display:none; margin-top:12px;">
    <div class="panel-title">陣營選擇</div>
    <div id="factionPickerInfo"></div>
    <div id="factionList"></div>
    <div id="factionVariantList" style="display:none; margin-top:8px;"></div>
    <div id="factionBaseList" style="display:none; margin-top:8px;"></div>
    <div id="factionDetailPanel" style="display:none; margin-top:10px;">
      <div class="panel-title">陣營資訊</div>
      <div id="factionDetailTitle"></div>
      <div id="factionDetailBases"></div>
      <div id="factionDetailAbilities"></div>
      <div id="factionDetailRules"></div>
      <div id="factionDetailWin"></div>
      <div id="factionConfirmBar" style="display:none; margin-top:10px;">
        <button id="confirmFactionBtn">確認陣營</button>
      </div>
    </div>
  </div>
</div>

<div id="factionActionModal" class="modal-overlay" style="display:none;">
  <div class="modal-glass">
    <div class="panel-title">陣營能力</div>
    <div id="factionActionModalTitle" class="modal-title-text">賭徒耳語</div>
    <div id="factionActionModalDesc" class="modal-body-text">請猜牌庫頂牌購買費用的奇偶。</div>
    <div id="factionActionModalChoices" class="modal-choice-row">
      <button id="guessOddBtn" class="modal-choice-btn">猜奇數</button>
      <button id="guessEvenBtn" class="modal-choice-btn">猜偶數</button>
    </div>
    <div id="factionActionModalRewardHint" class="modal-body-text" style="margin-top:4px; margin-bottom:12px;">猜中可獲得資金與宣傳；沒猜中則獲得較少獎勵。</div>
    <button id="closeFactionActionModal" class="modal-cancel-btn">取消</button>
  </div>
</div>

<div id="eraAchievementModal" class="modal-overlay" style="display:none;">
  <div class="modal-glass era-achievement-glass">
    <div class="panel-title">時代關卡達成</div>
    <div id="eraAchievementTitle" class="modal-title-text">[香港]香港人被自殺</div>
    <div id="eraAchievementCondition" class="modal-body-text"></div>
    <div class="era-achievement-section-title">紅軍壓制</div>
    <div id="eraAchievementSuccess" class="modal-body-text"></div>
    <div class="era-achievement-section-title">革命反撲</div>
    <div id="eraAchievementFail" class="modal-body-text"></div>
    <div id="eraAchievementDuration" class="modal-body-text" style="margin-top:6px;"></div>
    <div class="era-achievement-actions">
      <button id="eraAchievementMinimizeBtn" class="modal-choice-btn">縮到右上角</button>
    </div>
  </div>
</div>

<div id="eraPinnedNotice" style="display:none;"></div>

<div id="gameShell" style="display:none">
  <div id="gameTabs">
    <button class="game-tab active" data-view="command">指揮中心</button>
    <button class="game-tab" data-view="map">戰略地圖</button>
    <button class="game-tab" data-view="log">戰況紀錄</button>
  </div>

  <div id="commandView" class="game-view active">
    <div id="commandGrid">
      <div id="controlPanel" class="panel">
        <div id="buildSupportPanel" style="display:none; margin-top:8px;">
          <div class="panel-title">支援建立</div>
          <div id="buildSupportInfo"></div>
          <div id="buildSupportOrigins"></div>
          <div id="buildSupportTargets"></div>
        </div>
        <div id="factionActionPanel" style="display:none; margin-top:8px;">
          <div class="panel-title">陣營能力</div>
          <div id="factionActionInfo"></div>
          <div id="factionActionButtons"></div>
        </div>
        <div id="baseSelectionPanel" style="display:none; margin-top:8px;">
          <div class="panel-title">根據地選擇</div>
          <div id="baseSelectionInfo"></div>
          <div id="baseSelectionChoices"></div>
        </div>
        <div id="purchaseSection">
          <div class="panel-title">常設購買區</div>
          <div id="purchaseStatic" class="purchase-card-grid"></div>
        </div>
      </div>

      <div id="randomMarketPanel" class="panel market-panel-wide">
        <div class="panel-title">隨機購買區</div>
        <div id="purchaseRandom" class="purchase-card-grid"></div>
      </div>

      <div id="handPanel" class="panel hand-panel-wide">
        <div class="panel-title">手牌</div>
        <div id="hand"></div>
      </div>
    </div>
  </div>

  <div id="mapView" class="game-view">
    <div id="mapPanel" class="panel map-only-panel">
      <iframe
        id="strategicMapFrame"
        title="Strategic Map"
        src="about:blank"
        loading="eager"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </div>

  <div id="logView" class="game-view">
    <div id="logViewPanel" class="panel log-only-panel">
      <div class="panel-title">戰況總覽</div>
      <div id="playerStatusOverview" class="player-status-overview"></div>
      <div class="panel-title log-section-title">事件紀錄</div>
      <div id="logViewContent"></div>
    </div>
  </div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
