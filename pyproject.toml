[project]
name = "redline"
version = "2.0.0"
description = "Redline 桌遊原型：瀏覽器 UI 與 Python WebSocket 伺服器"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "mcp>=2.2.0",
    "pyyaml",
    "uvicorn[standard]",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "playwright",
    "requests",
    "websocket-client",
]

# 只有 macOS App 打包（packaging/macos/）才需要；Docker 與 `uv run` 不會安裝。
# 用 `uv sync --frozen --no-dev --group macos-app` 明確啟用。
macos-app = [
    "pyinstaller",
    "pywebview; sys_platform == 'darwin'",
]

[tool.uv]
package = false
