[project]
name = "redline"
version = "1.0.0"
description = "Redline 桌遊原型：瀏覽器 UI 與 Python WebSocket 伺服器"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "playwright",
    "requests",
    "websocket-client",
]

[tool.uv]
package = false
